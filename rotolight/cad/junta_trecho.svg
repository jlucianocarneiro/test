<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="Arial">
<defs><marker id="m" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z"/></marker></defs>
<rect width="980" height="520" fill="#fff"/>
<text x="490" y="30" font-size="19" text-anchor="middle">Rotolight v_08 — emenda dos trechos (vista de cima)</text>
<text x="490" y="54" font-size="13" text-anchor="middle" fill="#555">cada trilho (1100 mm) = 5 trechos de 220 mm</text>

<!-- TRILHO DE BAIXO: rabo de andorinha -->
<text x="60" y="95" font-size="15" font-weight="bold">Trilho de baixo (inf): rabo de andorinha</text>
<!-- trecho esquerdo com lingueta trapezoidal -->
<path d="M70,120 H430 L430,150 L470,140 L470,180 L430,170 L430,200 H70 Z" fill="#d9d9d9" stroke="#333"/>
<text x="250" y="165" font-size="12" text-anchor="middle" fill="#555">trecho esquerdo</text>
<!-- trecho direito com rasgo -->
<path d="M560,120 H910 V200 H560 L560,170 L520,180 L520,140 L560,150 Z" fill="#cfe0ef" stroke="#2a6f97"/>
<text x="740" y="165" font-size="12" text-anchor="middle" fill="#2a6f97">trecho direito</text>
<text x="470" y="128" font-size="12" fill="#2f6f2f">pescoço 18 mm</text>
<text x="470" y="200" font-size="12" fill="#2f6f2f">ponta 28 mm (trava)</text>
<line x1="500" y1="160" x2="528" y2="160" stroke="#000" stroke-width="1.4" marker-end="url(#m)"/>
<text x="514" y="120" font-size="12" text-anchor="middle">encaixa deslizando →</text>

<!-- TRILHO DE CIMA: junta de topo -->
<text x="60" y="300" font-size="15" font-weight="bold">Trilho de cima (sup): junta de topo (colada)</text>
<rect x="70" y="320" width="400" height="70" fill="#d9d9d9" stroke="#333"/>
<rect x="510" y="320" width="400" height="70" fill="#cfe0ef" stroke="#2a6f97"/>
<line x1="490" y1="315" x2="490" y2="395" stroke="#a00" stroke-width="2" stroke-dasharray="5 4"/>
<text x="490" y="412" font-size="12" text-anchor="middle" fill="#a00">topo a topo + cola</text>
<text x="490" y="430" font-size="12" text-anchor="middle" fill="#555">(o flange de cima é curto e tem ranhura no meio; rabo de andorinha ali criaria teto no ar)</text>

<text x="490" y="470" font-size="13" text-anchor="middle" fill="#555">O alumínio contínuo passa na ranhura de todos os trechos e alinha a barra;</text>
<text x="490" y="490" font-size="13" text-anchor="middle" fill="#555">o rabo de andorinha trava o inf, a cola + o alumínio fixam o sup.</text>
</svg>
